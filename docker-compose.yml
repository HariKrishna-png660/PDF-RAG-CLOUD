services:
  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
    networks:
      - pdf-rag-network

  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    networks:
      - pdf-rag-network

  backend:
    build: ./server
    ports:
      - 8000:8000
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - valkey
      - qdrant
    networks:
      - pdf-rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: ./server
    command: ["pnpm", "dev:worker"]
    environment:
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - valkey
      - qdrant
    networks:
      - pdf-rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./client
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - pdf-rag-network

networks:
  pdf-rag-network:
    driver: bridge
